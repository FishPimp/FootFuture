name: Bygg debug-APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bygg och testa
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checka ut koden
        uses: actions/checkout@v5

      - name: Installera JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK finns förinstallerad på GitHubs Ubuntu-runners (ANDROID_HOME).
      - name: Konfigurera Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gör gradlew körbar
        run: chmod +x ./gradlew

      - name: Kör enhetstester
        run: ./gradlew :domain:test --stacktrace

      - name: Bygg debug-APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Ladda upp app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
